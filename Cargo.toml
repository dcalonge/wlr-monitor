[package]
name = "wlr-monitor"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal monitor-layout editor for wlroots compositors using wlr-randr"
license = "MIT"
authors = ["Daniel Calonge Jiménez <dcalonge01@gmail.com>"]
repository = "https://github.com/dcalonge/wlr-monitor"
homepage = "https://github.com/dcalonge/wlr-monitor"
readme = "README.md"
keywords = ["wayland", "wlroots", "wlr-randr", "monitor", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
tempfile = "3"
tui-input = "0.15"
wait-timeout = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
