[package]
name = "wlr-monitor"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal monitor-layout editor for wlroots compositors using wlr-randr"
license = "MIT"
authors = ["Daniel Calonge Jiménez <dcalonge01@gmail.com>"]
repository = "https://github.com/dcalonge/wlr-monitor"
homepage = "https://github.com/dcalonge/wlr-monitor"
readme = "README.md"
keywords = ["wayland", "wlroots", "wlr-randr", "monitor", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "wlr-monitor"
path = "src/main.rs"

[lib]
name = "wlr_monitor"
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.191"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
unicode-width = "=0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
