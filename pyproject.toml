[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlr-monitor"
version = "0.1.0"
description = "A terminal monitor-layout editor for wlroots compositors using wlr-randr"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Daniel Calonge Jiménez", email = "dcalonge01@gmail.com" },
]
keywords = ["wayland", "wlroots", "wlr-randr", "monitor", "tui", "textual"]
classifiers = [
  "Environment :: Console",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: System :: Hardware",
]
dependencies = ["textual>=8.2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
wlr-monitor = "wlr_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/dcalonge/wlr-monitor"
Repository = "https://github.com/dcalonge/wlr-monitor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
